<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1b1b1f">
<title>BzStream</title>
<script>
  /* 首屏主题：在样式生效前定好，避免亮色闪一下（FOUC） */
  (function () {
    try {
      var saved = localStorage.getItem('bz-theme');
      var mode = saved || ((window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', mode);
      var m = document.querySelector('meta[name="theme-color"]');
      if (m) m.setAttribute('content', mode === 'dark' ? '#080c17' : '#ffffff');
    } catch (e) {}
  })();
</script>
<style>
  :root{
    color-scheme: light;
    --bar-h: 64px;
    --header-h: 64px;
    --bg:#f3f5fa; --glow-1:rgba(59,99,243,.06); --glow-2:rgba(16,185,129,.05);
    --card:#ffffff; --card-trans:rgba(255,255,255,.8);
    --code-bg:#f7f9fc; --border:rgba(60,60,67,0.12); --text:#3c3f43; --sub:rgba(60, 63, 67, 0.7);
    --accent:#3b82f6; --accent-soft:rgba(59,130,246,.10);
    --ok:#10b981; --ok-soft:rgba(16,185,129,.12);
    --warn:#f59e0b; --warn-soft:rgba(245,158,11,.12);
    --danger:#ef4444; --danger-soft:rgba(239,68,68,.10);
    --ring-track:#e5e9f2;
    --shadow:0 1px 2px rgba(0,0,0,.04), 0 10px 28px -18px rgba(0,0,0,.15);
    --panel-shadow:0 26px 50px -26px rgba(0,0,0,.25);
    --radius:16px;
    --vp-c-gray-soft: rgba(0, 0, 0, 0.05);
  }
  [data-theme="dark"]{
    color-scheme: dark;
    --bg:#080c17; --glow-1:rgba(59,130,246,.10); --glow-2:rgba(16,185,129,.06);
    --card:#121a2b; --card-trans:rgba(18,26,43,.82);
    --code-bg:#0a1120; --border:rgba(255,255,255,.12); --text:rgba(255,255,255,.87); --sub:rgba(255,255,255,.6);
    --accent:#3b82f6; --accent-soft:rgba(59,130,246,.15);
    --ok:#34d399; --ok-soft:rgba(52,211,153,.14);
    --warn:#fbbf24; --warn-soft:rgba(251,191,36,.14);
    --danger:#f87171; --danger-soft:rgba(248,113,113,.14);
    --ring-track:#243049;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -20px rgba(0,0,0,.8);
    --panel-shadow:0 26px 54px -28px rgba(0,0,0,.85);
    --vp-c-gray-soft: rgba(255, 255, 255, 0.1);
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    transition:background .25s ease,color .25s ease;
    padding:
      calc(var(--header-h) + 14px)
      calc(clamp(12px,2.6vw,28px) + env(safe-area-inset-right))
      calc(clamp(20px,3vw,32px) + env(safe-area-inset-bottom))
      calc(clamp(12px,2.6vw,28px) + env(safe-area-inset-left));
  }
  body::before{
    content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(720px 420px at 8% -8%, var(--glow-1), transparent 65%),
      radial-gradient(620px 380px at 100% 0%, var(--glow-2), transparent 60%);
  }
  .app{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

  button, a {
    -webkit-tap-highlight-color: transparent;
    outline: none;
  }
  button:focus, button:active, a:focus, a:active {
    outline: none;
  }
  button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ================= 顶栏与多层渐进式毛玻璃 ================= */
  @property --sp {
    syntax: '<number>';
    inherits: true;
    initial-value: 0;
  }

  @keyframes topbarScroll {
    from { --sp: 0; }
    to { --sp: 1; }
  }

  .topbar{
    position:fixed;top:0;left:0;right:0;z-index:60;
    padding-top:env(safe-area-inset-top);
    transition:background .25s ease,border-color .25s ease;
    --sp: 0;
    --bz-feather: 24px;
  }

  .topbar-fx {
    position: absolute;
    inset: 0 calc(-1 * env(safe-area-inset-right)) calc(-1 * var(--bz-feather)) calc(-1 * env(safe-area-inset-left));
    z-index: -1;
    pointer-events: none;
    overflow: hidden;
    contain: layout style paint;
  }

  .bz-l {
    position: absolute;
    inset: 0;
    background: var(--card-trans);
    -webkit-backdrop-filter: blur(var(--b, 0px)) saturate(1.8);
    backdrop-filter: blur(var(--b, 0px)) saturate(1.8);
    opacity: calc(var(--sp) * var(--o, 1));
    mask-image: var(--m);
    -webkit-mask-image: var(--m);
  }

  .bz-l1 { --b: 0.75px; --o: 0.2; --m: linear-gradient(to bottom, rgba(0,0,0,1) 0%, rgba(0,0,0,0.8) 100%); }
  .bz-l2 { --b: 2px;    --o: 0.4; --m: linear-gradient(to bottom, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 80%); }
  .bz-l3 { --b: 4.5px;  --o: 0.6; --m: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.4) 60%); }
  .bz-l4 { --b: 9px;    --o: 0.8; --m: linear-gradient(to bottom, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.2) 40%); }
  .bz-l5 { --b: 14px;   --o: 0.9; --m: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.05) 25%); }
  .bz-l6 { --b: 20px;   --o: 1.0; --m: linear-gradient(to bottom, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 15%); }

  .bz-tint {
    position: absolute;
    inset: 0;
    background: var(--card);
    opacity: calc(var(--sp) * 0.85);
    pointer-events: none;
  }

  .bz-divider {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 1px;
    background: var(--border);
    opacity: var(--sp);
    pointer-events: none;
  }

  @supports (animation-timeline: scroll()) {
    .topbar {
      animation: topbarScroll linear both;
      animation-timeline: scroll(root block);
      animation-range: 0px 80px;
    }
  }

  .topbar.is-solid {
    animation-name: none !important;
    --sp: 1 !important;
  }

  .topbar-inner{
    max-width:1440px;margin:0 auto;height:var(--bar-h);
    padding:0 calc(clamp(12px,2.6vw,28px) + env(safe-area-inset-right)) 0
              calc(clamp(12px,2.6vw,28px) + env(safe-area-inset-left));
    display:flex;align-items:center;justify-content:space-between;gap:12px;
  }

  .brand-title{
    display:flex;align-items:center;background:none;border:none;
    color:var(--text);font-weight:600;font-size:16px;cursor:pointer;
    padding:0;font-family:inherit;letter-spacing:-.01em;
  }

  .topbar-right{
    display:flex;align-items:center;gap:12px;
  }

  .theme-toggle {
    background-color: var(--vp-c-gray-soft);
    border: 1px solid var(--border);
    color: var(--text);
    width: 36px;
    height: 36px;
    border-radius: 9999px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background-color 0.2s, border-color 0.2s;
    padding: 0;
    position: relative;
    overflow: hidden;
  }
  @media (hover:hover){ .theme-toggle:hover { border-color: var(--accent); } }
  .theme-toggle svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
    position: absolute;
    transition: opacity 0.2s ease, transform 0.2s ease;
  }

  .sun-icon { opacity: 0; transform: scale(0.6); pointer-events: none; }
  .moon-icon { opacity: 1; transform: scale(1); }

  [data-theme="dark"] .sun-icon { opacity: 1; transform: scale(1); pointer-events: auto; }
  [data-theme="dark"] .moon-icon { opacity: 0; transform: scale(0.6); pointer-events: none; }

  .menu-btn{
    width:36px;height:36px;border-radius:9999px;flex:none;
    border:1px solid var(--border);background:transparent;color:var(--text);
    display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;
    transition:border-color .18s,color .18s,background .18s;
  }
  .menu-btn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  @media (hover:hover){ .menu-btn:hover{border-color:var(--accent);color:var(--accent)} }

  .menu-hamburger {
    width: 18px; height: 14px; display: flex; flex-direction: column;
    justify-content: space-between; align-items: center;
  }
  .menu-hamburger span {
    display: block; width: 100%; height: 2px;
    background-color: currentColor; border-radius: 2px;
  }

  /* ================= 下拉菜单面板 ================= */
  .panel-wrap{position:absolute;top:100%;left:0;right:0;pointer-events:none}
  @media (min-width:768px){
    .panel-wrap{
      max-width:1440px;margin:0 auto;display:flex;justify-content:flex-end;
      padding:0 calc(clamp(12px,2.6vw,28px) + env(safe-area-inset-right)) 0
                 calc(clamp(12px,2.6vw,28px) + env(safe-area-inset-left));
    }
  }
  .panel{
    pointer-events:auto;
    display:flex;flex-direction:column;
    max-height:min(72vh,640px);
    background:var(--card);
    border:1px solid var(--border);border-top:0;
    border-radius:0 0 18px 18px;
    box-shadow:var(--panel-shadow);
    -webkit-backdrop-filter:blur(24px);
    backdrop-filter:blur(24px);
    opacity:0;visibility:hidden;transform:translateY(-12px);
    transition:opacity .2s ease,transform .26s cubic-bezier(.32,.72,0,1),visibility .26s;
    overflow:hidden;
  }
  .panel.show{opacity:1;visibility:visible;transform:translateY(0)}
  @media (min-width:768px){ .panel{width:392px} }

  .panel-head{
    display:flex;align-items:center;gap:8px;
    padding:11px 14px;flex:none;border-bottom:1px solid var(--border);
  }
  .panel-head h3{
    margin:0;font-size:.87rem;font-weight:700;flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .panel-iconbtn{
    width:30px;height:30px;border-radius:9px;flex:none;padding:0;
    border:1px solid transparent;background:transparent;color:var(--sub);
    cursor:pointer;font-family:inherit;font-size:.8rem;line-height:1;
    display:grid;place-items:center;transition:.18s;
  }
  .panel-iconbtn svg{width:17px;height:17px;display:block}
  @media (hover:hover){ .panel-iconbtn:hover{background:var(--accent-soft);color:var(--accent)} }
  .panel-close{font-size:.82rem}
  @media (hover:hover){ .panel-close:hover{background:var(--danger-soft);color:var(--danger)} }
  .panel-back[hidden]{display:none}

  .panel-body{
    overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    padding:12px 20px 22px;
  }
  .panel-body.is-menu{padding:10px 10px 12px}
  .panel-body.anim{animation:panelFade .18s ease}
  @keyframes panelFade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  .panel-body h4{margin:17px 0 7px;font-size:.8rem;font-weight:700;color:var(--text)}
  .panel-body h4:first-child{margin-top:6px}
  .panel-body p{margin:0 0 8px;font-size:.79rem;line-height:1.75;color:var(--sub)}
  .panel-body ul{margin:0;padding-left:18px}
  .panel-body li{font-size:.79rem;line-height:1.75;color:var(--sub);margin-bottom:5px}
  .panel-body b{color:var(--text);font-weight:700}
  .panel-body code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.72rem;background:var(--code-bg);padding:1.5px 5px;
    border-radius:5px;color:var(--accent);
  }
  .panel-body a{color:var(--accent);text-decoration:none;word-break:break-all}

  .menu-list{display:flex;flex-direction:column;gap:4px}
  .menu-item{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    border:0;background:transparent;color:var(--text);
    padding:11px 12px;border-radius:11px;cursor:pointer;font-family:inherit;
    font-size:.84rem;font-weight:500;
    transition:background .18s,color .18s;
  }
  .menu-item svg{width:18px;height:18px;color:var(--sub);flex:none}
  .menu-item span{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  @media (hover:hover){ .menu-item:hover{background:var(--accent-soft);color:var(--accent)} }
  @media (hover:hover){ .menu-item:hover svg{color:var(--accent)} }

  .repo-link{
    display:flex;align-items:center;gap:9px;margin:8px 0 4px;
    border:1px solid var(--border);border-radius:12px;padding:12px 14px;
    background:var(--code-bg);text-decoration:none;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.72rem;color:var(--accent);transition:border-color .18s;
  }
  @media (hover:hover){ .repo-link:hover{border-color:var(--accent)} }
  .repo-link svg{width:16px;height:16px;flex:none}
  .repo-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .kv{display:flex;justify-content:space-between;gap:14px;padding:9px 0;border-bottom:1px solid var(--border);font-size:.79rem}
  .kv:last-child{border-bottom:0}
  .kv span:first-child{color:var(--sub);flex:none}
  .kv span:last-child{color:var(--text);text-align:right;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.74rem;word-break:break-all}

  .opt-list{display:flex;flex-direction:column;gap:9px;margin-top:10px}
  .opt{
    display:flex;align-items:center;gap:12px;width:100%;text-align:left;
    border:1px solid var(--border);background:var(--card);color:var(--text);
    padding:13px 15px;border-radius:13px;cursor:pointer;font-family:inherit;
    font-size:.84rem;transition:border-color .18s,background .18s;
  }
  .opt.active{border-color:var(--accent);background:var(--accent-soft)}
  @media (hover:hover){ .opt:hover{border-color:var(--accent)} }
  .opt-name{font-weight:700;flex:none}
  .opt-note{font-size:.71rem;color:var(--sub);margin-left:auto;text-align:right}
  .opt-check{color:var(--accent);font-weight:800;flex:none}

  .author{display:flex;align-items:center;gap:12px;margin:14px 0 12px}
  .panel-body .author:first-child{margin-top:2px}
  .author-avatar{
    position:relative;flex:none;width:54px;height:54px;border-radius:50%;
    overflow:hidden;display:grid;place-items:center;
    background:linear-gradient(135deg,var(--accent),#8b5cf6);
    box-shadow:0 10px 22px -14px var(--accent);
  }
  .author-avatar > span{
    position:relative;z-index:0;color:#fff;
    font-weight:800;font-size:1.15rem;letter-spacing:.02em;
  }
  .author-avatar img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:cover;display:block;z-index:1;background:var(--code-bg);
  }
  .author-meta{min-width:0}
  .author-name{
    font-size:.92rem;font-weight:700;color:var(--text);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .author-role{font-size:.72rem;color:var(--sub);margin-top:2px}

  .author-links{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 2px}
  .author-link{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--border);border-radius:10px;
    padding:7px 11px;font-size:.74rem;font-weight:600;
    color:var(--text);text-decoration:none;background:var(--card);
    transition:border-color .18s,color .18s,background .18s;
    white-space:nowrap;
  }
  @media (hover:hover){
    .author-link:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
    .author-link:hover svg{color:var(--accent)}
  }
  .author-link svg{width:15px;height:15px;flex:none;color:var(--sub);transition:color .18s}

  .backdrop{
    position:fixed;inset:0;z-index:50;
    background:rgba(8,12,23,.42);
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    opacity:0;visibility:hidden;transition:opacity .24s ease,visibility .24s ease;
  }
  .backdrop.show{opacity:1;visibility:visible}

  .grid{display:grid;grid-template-columns:1fr;gap:16px}
  .col{display:flex;flex-direction:column;gap:16px;min-width:0}
  @media (min-width:920px){
    .grid{grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:20px;align-items:start}
    .col-right{position:sticky;top:calc(var(--header-h) + 18px)}
  }
  .card{
    background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);
    transition:background .25s ease,border-color .25s ease;
  }
  @media (min-width:640px){ .card{padding:20px 22px} }
  .card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
  .card-head h2{margin:0;font-size:.9rem;font-weight:700;letter-spacing:.01em}
  .pill{
    font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;
    background:var(--accent-soft);color:var(--accent);white-space:nowrap;
  }
  .pill.ok{background:var(--ok-soft);color:var(--ok)}
  .pill.warn{background:var(--warn-soft);color:var(--warn)}
  .pill.danger{background:var(--danger-soft);color:var(--danger)}

  .score-card{display:flex;align-items:center;gap:20px}
  @media (max-width:400px){ .score-card{gap:14px} }
  .ring{
    --p:0;--ring-color:var(--ok);
    position:relative;flex:none;width:104px;height:104px;border-radius:50%;
    background:conic-gradient(var(--ring-color) calc(var(--p) * 1%), var(--ring-track) 0);
    display:grid;place-items:center;
  }
  .ring::after{content:"";position:absolute;inset:9px;border-radius:50%;background:var(--card)}
  .ring-inner{position:relative;z-index:1;text-align:center}
  #risk-score{font-size:1.55rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
  .ring-unit{display:block;margin-top:5px;font-size:.66rem;color:var(--sub);letter-spacing:.08em}
  .score-meta{min-width:0;flex:1}
  .kicker{font-size:.72rem;letter-spacing:.1em;color:var(--sub);font-weight:600}
  .verdict{
    display:inline-flex;align-items:center;gap:7px;margin-top:8px;
    font-size:1rem;font-weight:800;padding:5px 13px;border-radius:999px;
  }
  .verdict::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .verdict.ok{color:var(--ok);background:var(--ok-soft)}
  .verdict.warn{color:var(--warn);background:var(--warn-soft)}
  .verdict.danger{color:var(--danger);background:var(--danger-soft)}
  .hint{margin:9px 0 0;font-size:.76rem;line-height:1.55;color:var(--sub)}

  .list{list-style:none;margin:0;padding:0}
  .group{
    display:flex;align-items:center;gap:10px;
    padding:18px 0 8px;font-size:.7rem;font-weight:700;letter-spacing:.14em;
    color:var(--sub);text-transform:uppercase;
  }
  .list .group:first-child{padding-top:2px}
  .group::after{content:"";flex:1;height:1px;background:var(--border)}
  .row{
    display:grid;grid-template-columns:1fr;gap:3px;
    padding:11px 0;border-bottom:1px solid var(--border);
  }
  .row:last-child{border-bottom:0}
  @media (min-width:560px){
    .row{grid-template-columns:minmax(0,auto) minmax(0,1fr);align-items:start;column-gap:18px}
  }
  .row-label{display:flex;align-items:center;gap:9px;font-size:.83rem;font-weight:500;color:var(--sub)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--border);flex:none;transition:background .2s}
  .dot.ok{background:var(--ok)}
  .dot.warn{background:var(--warn)}
  .dot.danger{background:var(--danger)}
  .dot.busy{background:var(--accent);animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  .row-val{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    font-size:.8rem;line-height:1.5;color:var(--text);
    word-break:break-word;overflow-wrap:anywhere;
  }
  @media (min-width:560px){ .row-val{text-align:right} }
  .row-val.ok{color:var(--ok)}
  .row-val.warn{color:var(--warn)}
  .row-val.danger{color:var(--danger);font-weight:600}
  .row-val.pending{color:var(--sub);font-weight:400}
  .note{
    display:block;margin-top:3px;font-size:.71rem;font-weight:400;color:var(--sub);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",Roboto,sans-serif;
    word-break:break-word;
  }

  .json-card{display:flex;flex-direction:column}
  .btn-copy{
    display:inline-flex;align-items:center;gap:6px;border:0;
    background:var(--accent);color:#fff;padding:8px 15px;border-radius:10px;

  textarea{
    display:block;width:100%;height:clamp(220px,38vh,420px);
    background:var(--code-bg);color:var(--text);
    border:1px solid var(--border);border-radius:12px;padding:14px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:.76rem;line-height:1.7;resize:vertical;outline:none;
    transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;
  }
  textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  @media (min-width:920px){ textarea{height:clamp(300px,46vh,560px)} }

  .foot{margin:0 0 4px;font-size:.72rem;color:var(--sub);text-align:center;line-height:1.7}

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important;animation:none !important}
  }
</style>

            setFlag('webrtc', t('rtc.flagLeak', { ip: p }), 30, t('rtc.flagLeakDetail'));
          } else if (egress.ip && pub.indexOf(egress.ip) !== -1) {
            setRow('webrtc', t('rtc.match', { ip: p }), 'warn', notes.join(' · '));
            setFlag('webrtc', t('rtc.flagPubProxied'), 15, p);
          } else {
            setRow('webrtc', t('rtc.pub', { ip: p }), 'warn', notes.join(' · '));
            setFlag('webrtc', t('rtc.flagPub'), 12, p);
          }
        } else if (priv.length) {
          setRow('webrtc', t('rtc.lanOnly'), 'warn', notes.join(' · '));
          setFlag('webrtc', t('rtc.flagLan'), 5, priv.slice(0, 3).join(', '));
        } else if (ice.mdns) {
          setRow('webrtc', t('rtc.mdnsOk'), 'ok', notes.join(' · '));
        } else {
          setRow('webrtc', t('rtc.none'), 'warn', (iceErr ? iceErr + ' · ' : '') + notes.join(' · '));
        }
        finalize();
      }

      (function () {
        var pc;
        try { pc = new RTC({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }); }
        catch (e) { iceDone = true; iceErr = t('rtc.buildFail'); render(); return; }

        var finished = false;
        function finish() {
          if (finished) return; finished = true;
          try { pc.close(); } catch (e) {}
          iceDone = true; render();
        }
        try {
          pc.createDataChannel('bz');
          pc.onicecandidate = function (e) {
            if (!e.candidate) { setTimeout(finish, 150); return; }
            var cand = e.candidate;
            var ip = cand.address || '';
            if (!ip) {
              var m = (cand.candidate || '').match(/([0-9]{1,3}(?:\.[0-9]{1,3}){3})/);
              ip = m ? m[1] : '';
            }
            if (ip) classifyIp(ip, ice);
          };
          pc.createOffer().then(function (o) { return pc.setLocalDescription(o); })
            .catch(function () { finish(); });
        } catch (e) { finish(); return; }
        setTimeout(finish, 2200);
      })();

      (function () {
        if (!window.fetch || !/^https?:$/.test(location.protocol)) {
          ipDone = true;
          egress = { ip: null, note: location.protocol === 'file:' ? t('rtc.fileNote') : t('rtc.noFetch') };
          render(); return;
        }
        var ctrl = ('AbortController' in window) ? new AbortController() : null;
        var timer = setTimeout(function () {
          if (ctrl) ctrl.abort();
          if (!ipDone) { ipDone = true; egress = { ip: null, note: t('rtc.timeout') }; render(); }
        }, 1800);
        fetch('https://api.ipify.org?format=json', { signal: ctrl ? ctrl.signal : undefined, cache: 'no-store' })
          .then(function (r) { return r.json(); })
          .then(function (j) {
            clearTimeout(timer);
            if (ipDone) return;
            ipDone = true;
            egress = { ip: j && j.ip ? String(j.ip) : null, note: j && j.ip ? null : t('rtc.empty') };
            render();
          })
          .catch(function () {
            clearTimeout(timer);
            if (ipDone) return;
            ipDone = true;
            egress = { ip: null, note: t('rtc.blocked') };
            render();
          });
      })();
    });

    safe('raf', function () {
      if (document.visibilityState !== 'visible') {
        setRow('raf', t('raf.hidden'), 'warn', t('raf.hiddenNote'));
        finalize(); return;
      }
      setRow('raf', t('raf.sampling'), 'pending');

      var times = [], t0 = performance.now(), finished = false;
      function done() {
        if (finished || run !== runToken) return;
        finished = true;
        if (!times.length) {
          setRow('raf', t('raf.none'), 'danger', t('raf.noneNote'));
          setFlag('raf', t('raf.flagNone'), 25, 'requestAnimationFrame no callback');
          finalize(); return;
        }
        var intervals = [], sum = 0;
        for (var i = 1; i < times.length; i++) { var d = times[i] - times[i - 1]; intervals.push(d); sum += d; }
        if (!intervals.length) { setRow('raf', t('raf.oneFrame'), 'warn'); finalize(); return; }

        var mean = sum / intervals.length;
        var fps = 1000 / mean;
        var varSum = 0;
        intervals.forEach(function (d) { varSum += (d - mean) * (d - mean); });
        var std = Math.sqrt(varSum / intervals.length);
        rafStats = { fps: Math.round(fps * 10) / 10, jitter: Math.round(std * 1000) / 1000, frames: times.length };

        var text = t('raf.text', { f: rafStats.fps, j: Math.round(std * 100) / 100 });
        var note = t('raf.frames', { n: times.length });
        var level = 'ok';

        if (fps > 200) {
          level = 'danger'; note = t('raf.noteHigh') + ' · ' + note;
          setFlag('raf', t('raf.flagHigh', { n: Math.round(fps) }), 20, t('raf.flagHighDetail'));
        } else if (std < 0.3 && fps > 55 && fps < 65) {
          level = 'warn'; note = t('raf.noteStable') + ' · ' + note;
          setFlag('raf', t('raf.flagStable'), 12, std.toFixed(3) + 'ms');
        } else if (fps < 15) {
          level = 'warn'; note = t('raf.noteLow') + ' · ' + note;
          setFlag('raf', t('raf.flagLow', { n: Math.round(fps) }), 6, t('raf.flagLowDetail'));
        }
        setRow('raf', text, level, note);
        finalize();
      }
      function loop(now) { times.push(now); if (now - t0 < 1200) requestAnimationFrame(loop); }
      requestAnimationFrame(loop);
      setTimeout(done, 1600);
    });

    safe('clock', function () {
      setRow('clock', t('clock.measuring'), 'pending');

      var minDelta = Infinity, prev = performance.now();
      for (var i = 0; i < 2000; i++) {
        var nowT = performance.now(), d = nowT - prev;
        if (d > 0 && d < minDelta) minDelta = d;
        prev = nowT;
      }
      var res = (minDelta === Infinity) ? null : Math.round(minDelta * 1000) / 1000;
      var skew = null;
      try { skew = Math.round(Date.now() - (performance.timeOrigin + performance.now())); } catch (e) {}
      clockStats = { resolution: res, skew: skew, serverOffset: null };

      var notes = [];
      if (res !== null) notes.push(t('clock.resolution', { v: res }) + (res >= 1 ? t('clock.resolutionDegraded') : ''));
      if (skew !== null) notes.push(t('clock.skewNote', { v: skew }));

      if (skew !== null && Math.abs(skew) > 2000) {
        setRow('clock', t('clock.skew', { v: skew }), 'danger', notes.join(' · '));
        setFlag('clock', t('clock.flagSkew'), 18, t('clock.flagSkewDetail', { v: skew }));
      } else {
        setRow('clock', t('clock.sync'), 'ok', notes.join(' · '));
      }
      if (res !== null && res >= 1) setFlag('clock', t('clock.flagRes'), 6, res + 'ms');

      if (/^https?:$/.test(location.protocol) && window.fetch && run === runToken) {
        var ctrl = ('AbortController' in window) ? new AbortController() : null;
        var timer = setTimeout(function () { if (ctrl) ctrl.abort(); finalize(); }, 1500);
        fetch(location.href, { method: 'HEAD', cache: 'no-store', signal: ctrl ? ctrl.signal : undefined })
          .then(function (r) {
            clearTimeout(timer);
            if (run !== runToken) return;
            var dh = r.headers.get('date');
            if (!dh) throw new Error('no date');
            var off = Math.round(new Date(dh).getTime() - Date.now());
            clockStats.serverOffset = off;
            if (Math.abs(off) > 120000) {
              setRow('clock', t('clock.serverOff', { s: Math.round(off / 1000) }), 'warn', notes.join(' · '));
              setFlag('clock', t('clock.flagServer'), 8, off + 'ms');
            } else {
              var s = document.createElement('small');
              s.className = 'note';
              s.textContent = t('clock.serverNote', { s: (off / 1000).toFixed(1) });
              rows['clock'].val.appendChild(s);
            }
            finalize();
          })
          .catch(function () { clearTimeout(timer); finalize(); });
      }
      finalize();
    });

    safe('locale', function () {
      var tzShown = (tz === '未知') ? t('locale.unknown') : tz;
      if (tz === '未知') {
        setRow('locale', langs.join(', ') + ' / ' + tzShown, 'warn');
        setFlag('locale', t('locale.flag'), 8, t('locale.flagDetail'));
      } else {
        setRow('locale', langs.join(', ') + ' / ' + tzShown, 'ok');
      }
      finalize();
    });

    if (guardTimer) clearTimeout(guardTimer);
    guardTimer = setTimeout(function () {
      if (run !== runToken) return;
      Object.keys(rows).forEach(function (id) {
        if (!doneMap[id]) {
          rowData[id].level = 'warn';
          rowData[id].timeout = true;
          paintRow(id);
        }
      });
      finalize();
    }, 5000);
  }

  /* ================= 菜单面板 ================= */
  var backdrop = $('#backdrop'), panel = $('#panel');
  var panelTitle = $('#panel-title'), panelBody = $('#panel-body');
  var panelBack = $('#panel-back'), menuToggle = $('#menu-toggle');
  var currentPanel = null, lastFocus = null;

  function setPanelBody(html, isMenu) {
    panelBody.className = 'panel-body' + (isMenu ? ' is-menu' : '');
    panelBody.innerHTML = html;
    panelBody.classList.remove('anim');
    void panelBody.offsetWidth;
    panelBody.classList.add('anim');
    panelBody.scrollTop = 0;
    bindAvatarFallback();
  }

  function escHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function authorCardHtml() {
    var a = PROJECT.author || {};
    var initial = escHtml(String(a.name || 'B').trim().charAt(0).toUpperCase());
    var links = [
      { href: a.profile,      icon: '#i-github', label: t('author.profile') },
      { href: PROJECT.repo,   icon: '#i-oss',    label: t('author.repo') },
      { href: PROJECT.issues, icon: '#i-link',   label: t('author.issues') }
    ].filter(function (l) { return !!l.href; });

    return '<div class="author">' +
        '<div class="author-avatar">' +
          '<span>' + initial + '</span>' +
          (a.avatar
            ? '<img data-avatar-img src="' + escHtml(a.avatar) + '" alt="' +
              escHtml(a.name) + '" loading="lazy" decoding="async">'
            : '') +
        '</div>' +
        '<div class="author-meta">' +
          '<div class="author-name">' + escHtml(a.name) + '</div>' +
          '<div class="author-role">' + t('author.role') + '</div>' +
        '</div>' +
      '</div>' +
      '<div class="author-links">' + links.map(function (l) {
        return '<a class="author-link" href="' + escHtml(l.href) + '"' +
               ' target="_blank" rel="noopener noreferrer">' +
               '<svg><use href="' + l.icon + '"/></svg>' +
               '<span>' + l.label + '</span></a>';
      }).join('') + '</div>';
  }

  function bindAvatarFallback() {
    var img = panelBody.querySelector('[data-avatar-img]');
    if (!img) return;
    var list = [PROJECT.author.avatar]
      .concat(PROJECT.author.avatarFallbacks || [])
      .filter(Boolean);
    var i = 0;
    function next() {
      i++;
      if (i < list.length) { img.src = list[i]; }
      else if (img.parentNode) { img.parentNode.removeChild(img); }
    }
    img.addEventListener('error', next);
    if (img.complete && img.naturalWidth === 0) next();
  }

  function buildPanel(kind) {
    if (!kind || kind === 'menu') {
      return '<div class="menu-list">' +
        '<button class="menu-item" type="button" data-goto="help"><svg><use href="#i-help"/></svg><span>' + t('nav.help') + '</span></button>' +
        '<button class="menu-item" type="button" data-goto="oss"><svg><use href="#i-oss"/></svg><span>' + t('nav.oss') + '</span></button>' +
        '<button class="menu-item" type="button" data-goto="lang"><svg><use href="#i-lang"/></svg><span>' + t('nav.lang') + '</span></button>' +
        '<button class="menu-item" type="button" data-action="retest"><svg><use href="#i-retest"/></svg><span>' + t('nav.retest') + '</span></button>' +
      '</div>';
    }
    if (kind === 'help') {
      return '<h4>' + t('help.about.h') + '</h4><p>' + t('help.about.p') + '</p>' +
        '<h4>' + t('help.score.h') + '</h4><ul>' +
          '<li><b>0 – 24</b>&nbsp; ' + t('help.score.low') + '</li>' +
          '<li><b>25 – 59</b>&nbsp; ' + t('help.score.mid') + '</li>' +
          '<li><b>60 – 100</b>&nbsp; ' + t('help.score.high') + '</li>' +
        '</ul>' +
        '<h4>' + t('help.groups.h') + '</h4><ul>' +
          GROUPS.map(function (g) {
            return '<li><b>' + t('group.' + g.key) + '</b> — ' + t('help.g.' + g.key) + '</li>';
          }).join('') +
        '</ul>' +
        '<h4>' + t('help.notes.h') + '</h4><p>' + t('help.notes.p') + '</p>';
    }
    if (kind === 'oss') {
      return authorCardHtml() +
        '<h4>' + t('oss.about.h') + '</h4><p>' + t('oss.about.p') + '</p>' +
        '<h4>' + t('oss.repo.h') + '</h4>' +
        '<a class="repo-link" href="' + PROJECT.repo + '" target="_blank" rel="noopener noreferrer">' +
          '<svg><use href="#i-link"/></svg><span>' + PROJECT.repo + '</span></a>' +
        '<h4>' + t('oss.license.h') + '</h4>' +
        '<div class="kv"><span>' + t('oss.license.h') + '</span><span>' + PROJECT.license + '</span></div>' +
        '<div class="kv"><span>Version</span><span>' + PROJECT.version + '</span></div>' +
        '<div class="kv"><span>Issues</span><span>' + PROJECT.issues.replace(/^https?:\/\//, '') + '</span></div>' +
        '<h4>' + t('oss.stack.h') + '</h4><p>' + t('oss.stack.p') + '</p>' +
        '<p>' + t('oss.note') + '</p>';
    }
    if (kind === 'lang') {
      return '<p>' + t('lang.p') + '</p><div class="opt-list">' +
        Object.keys(I18N).map(function (l) {
          return '<button class="opt' + (l === locale ? ' active' : '') + '" type="button" data-locale="' + l + '">' +
            '<span class="opt-name">' + I18N[l]['lang.name'] + '</span>' +
            '<span class="opt-note">' + (l === locale ? I18N[l]['lang.note'] : '') + '</span>' +
            (l === locale ? '<span class="opt-check">✓</span>' : '') +
          '</button>';
        }).join('') + '</div>';
    }
    return '';
  }

  function lockScroll(on) {
    if (on) {
      var sw = window.innerWidth - document.documentElement.clientWidth;
      document.body.style.overflow = 'hidden';
      if (sw > 0) document.body.style.paddingRight = sw + 'px';
    } else {
      document.body.style.overflow = '';
      document.body.style.paddingRight = '';
    }
  }

  function openPanel(kind) {
    if (!currentPanel) lastFocus = document.activeElement;
    currentPanel = kind;
    topbar.classList.add('is-solid');
    panelTitle.textContent = kind === 'menu' ? t('panel.menu') : t('panel.' + kind);
    panelBack.hidden = (kind === 'menu');
    setPanelBody(buildPanel(kind), kind === 'menu');
    backdrop.classList.add('show');
    panel.classList.add('show');
    panel.setAttribute('aria-hidden', 'false');
    menuToggle.setAttribute('aria-expanded', 'true');
    lockScroll(true);
    var closeBtn = $('#panel-close');
    if (closeBtn && closeBtn.focus) {
      try { closeBtn.focus({ preventScroll: true }); } catch (e) { closeBtn.focus(); }
    }
  }

  function closePanel() {
    if (!currentPanel) return;
    currentPanel = null;
    backdrop.classList.remove('show');
    panel.classList.remove('show');
    panel.setAttribute('aria-hidden', 'true');
    menuToggle.setAttribute('aria-expanded', 'false');
    lockScroll(false);
    if ((window.scrollY || document.documentElement.scrollTop || 0) <= 5) {
      topbar.classList.remove('is-solid');
    }
    if (lastFocus && lastFocus.focus) {
      try { lastFocus.focus({ preventScroll: true }); } catch (e) {}
    }
    lastFocus = null;
  }

  backdrop.addEventListener('click', closePanel);
  $('#panel-close').addEventListener('click', closePanel);
  panelBack.addEventListener('click', function () { openPanel('menu'); });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape' || !currentPanel) return;
    if (currentPanel === 'menu') closePanel();
    else openPanel('menu');
  });

  menuToggle.addEventListener('click', function () {
    if (currentPanel) closePanel();
    else openPanel('menu');
  });

  panelBody.addEventListener('click', function (e) {
    if (!e.target.closest) return;

    var gotoBtn = e.target.closest('[data-goto]');
    if (gotoBtn) { openPanel(gotoBtn.getAttribute('data-goto')); return; }

    var localeBtn = e.target.closest('[data-locale]');
    if (localeBtn) { setLocale(localeBtn.getAttribute('data-locale')); return; }

    var actionBtn = e.target.closest('[data-action]');
    if (actionBtn) {
      var action = actionBtn.getAttribute('data-action');
      if (action === 'retest') {
        closePanel();
        doRetest();
      }
    }
  });

  /* ================= 滚动渐进模糊联动与降级方案 ================= */
  var supportsScrollTimeline = window.CSS && CSS.supports && CSS.supports('animation-timeline: scroll()');

  if (!supportsScrollTimeline) {
    var lastVal = -1;
    function updateScrollProgress() {
      if (currentPanel) return;
      var y = window.scrollY || document.documentElement.scrollTop || 0;
      var p = Math.max(0, Math.min(1, y / 80));
      var quantized = Math.round(p * 25) / 25; // 4% 步长减少 repaint 开销
      if (quantized !== lastVal) {
        lastVal = quantized;
        topbar.style.setProperty('--sp', quantized);
      }
    }
    window.addEventListener('scroll', updateScrollProgress, { passive: true });
    updateScrollProgress();
  }

  window.addEventListener('scroll', function () {
    if (currentPanel) return;
    var y = window.scrollY || document.documentElement.scrollTop || 0;
    if (y > 5) {
      topbar.classList.add('is-solid');
    } else {
      topbar.classList.remove('is-solid');
    }
  }, { passive: true });

  function doRetest() {
    var ico = menuToggle.querySelector('.menu-hamburger');
    if (ico && !reduceMotion) {
      ico.style.transition = 'transform .6s ease';
      ico.style.transform = 'rotate(360deg)';
      setTimeout(function () { ico.style.transition = ''; ico.style.transform = ''; }, 620);
    }
    window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
    resetAll();
    runChecks();
  }

  function applyStaticText() {
    $$('[data-i18n]').forEach(function (el) { el.textContent = t(el.getAttribute('data-i18n')); });
    $$('[data-i18n-aria]').forEach(function (el) { el.setAttribute('aria-label', t(el.getAttribute('data-i18n-aria'))); });
    GROUPS.forEach(function (g) { groupEls[g.key].textContent = t('group.' + g.key); });
    Object.keys(rows).forEach(function (id) { rows[id].labelEl.textContent = t('row.' + id); });
  }

  function setLocale(l) {
    if (!I18N[l] || l === locale) return;
    locale = l;
    try { localStorage.setItem(LOCALE_KEY, l); } catch (e) {}
    root.setAttribute('lang', l);
    applyStaticText();
    Object.keys(rows).forEach(paintRow);
    if (currentPanel) {
      panelTitle.textContent = currentPanel === 'menu' ? t('panel.menu') : t('panel.' + currentPanel);
      setPanelBody(buildPanel(currentPanel), currentPanel === 'menu');
    }
    syncHeaderHeight();
    finalize();
  }

  function resetAll() {
    runToken++;
    if (guardTimer) { clearTimeout(guardTimer); guardTimer = null; }
    doneMap = {}; flagMap = {};
    outerInfo = null; glCaps = null; glCtx = null;
    nativeReport = { checked: 0, fails: [], meta: false };
    netReport = { rtcPublic: [], rtcPrivate: [], mdns: 0, egress: null, egressNote: '' };
    rafStats = { fps: null, jitter: null, frames: null };
    clockStats = { resolution: null, skew: null, serverOffset: null };
    canvasHash = '—'; glRenderer = '', glVendor = '';

    Object.keys(rows).forEach(function (id) {
      rowData[id] = { text: t('row.waiting'), level: 'pending', note: null, timeout: false };
      paintRow(id);
    });
    lastScore = 0;
    finalize();
  }

  function markCopied() {
    btn.textContent = t('btn.copied');
    btn.classList.add('done');
    setTimeout(function () {
      btn.textContent = t('btn.copy');
      btn.classList.remove('done');
    }, 1500);
  }

  btn.addEventListener('click', function () {
    var text = ta.value;
    function fallback() {
      ta.removeAttribute('readonly');
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      try { document.execCommand('copy'); markCopied(); } catch (e) {}
      ta.setAttribute('readonly', 'readonly');
      if (window.getSelection) window.getSelection().removeAllRanges();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(markCopied).catch(fallback);
    } else {
      fallback();
    }
  });

  root.setAttribute('lang', locale);
  applyStaticText();
  hintEl.textContent = t('hint.init');
  syncHeaderHeight();
  resetAll();
  runChecks();
  window.addEventListener('load', syncHeaderHeight);
})();
</script>
</body>
</html>
